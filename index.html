<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dart for Three — 501 Double Out</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --darts-red: #dc2626;
        --darts-red-bright: #ef4444;
        --darts-red-soft: #f87171;
        --darts-amber: #fbbf24;
        --darts-amber-light: #fcd34d;
        --darts-green: #15803d;
        --darts-green-bright: #16a34a;
        --darts-bg-mid: #0a0606;
        --darts-bg-warm: #1f1410;
        --darts-stone-100: #f5f5f4;
        --darts-stone-200: #e7e5e4;
        --darts-stone-300: #d6d3d1;
        --darts-stone-400: #a8a29e;
        --darts-stone-500: #78716c;
        --darts-stone-600: #57534e;
        --darts-stone-700: #44403c;
        --darts-stone-800: #292524;
        --darts-stone-900: #1c1917;
      }
      html, body {
        margin: 0;
        background: var(--darts-bg-mid);
        color: var(--darts-stone-100);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-feature-settings: 'cv11', 'ss01';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .darts-root {
        min-height: 100svh;
        background: radial-gradient(ellipse at top, var(--darts-bg-warm) 0%, var(--darts-bg-mid) 60%, #000 100%);
      }
      .darts-container {
        max-width: 64rem;
        margin: 0 auto;
        padding: 1rem 0.75rem;
        position: relative;
      }
      .darts-game-view {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
        min-height: calc(100svh - 2rem);
      }
      .darts-grain::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.06;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .darts-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--darts-stone-800);
        flex-shrink: 0;
      }
      .darts-title {
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: clamp(1.25rem, 5vw, 2.5rem);
        color: var(--darts-red-bright);
        text-shadow: 0 2px 20px rgba(220, 38, 38, 0.4);
        margin: 0;
        line-height: 1;
      }
      .darts-subtitle {
        color: var(--darts-stone-500);
        font-size: 0.75rem;
        font-weight: 400;
        margin: 0.25rem 0 0;
        letter-spacing: 0.01em;
      }
      @media (max-width: 480px) {
        .darts-subtitle { display: none; }
      }
      .darts-link-btn {
        background: transparent;
        border: none;
        color: var(--darts-stone-500);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        cursor: pointer;
        font-family: inherit;
        padding: 0.25rem 0;
        transition: color 0.15s;
      }
      .darts-link-btn:hover:not(:disabled) { color: var(--darts-red-soft); }
      .darts-link-btn:disabled { opacity: 0.3; cursor: not-allowed; }
      .darts-card {
        background: rgba(12, 10, 9, 0.6);
        border: 1px solid var(--darts-stone-800);
        border-radius: 2px;
        padding: 0.875rem;
      }
      .darts-card-title {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 1.5rem;
        color: var(--darts-stone-200);
        margin: 0 0 1.5rem;
      }
      .darts-setup { padding: 1.5rem; margin-top: 1rem; }
      .darts-name-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
      .darts-name-row { display: flex; align-items: center; gap: 1rem; }
      .darts-name-num {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        font-size: 1.75rem;
        color: var(--darts-red);
        width: 2.5rem;
        text-align: center;
      }
      .darts-name-input {
        flex: 1;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--darts-stone-700);
        outline: none;
        padding: 0.5rem 0;
        font-size: 1.25rem;
        color: var(--darts-stone-100);
        font-family: inherit;
        transition: border-color 0.15s;
      }
      .darts-name-input:focus { border-bottom-color: var(--darts-red-bright); }
      .darts-remove-btn {
        background: transparent;
        border: 1px solid var(--darts-stone-700);
        color: var(--darts-stone-500);
        width: 2rem;
        height: 2rem;
        border-radius: 2px;
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        font-family: inherit;
        transition: color 0.15s, border-color 0.15s;
      }
      .darts-remove-btn:hover:not(:disabled) { color: var(--darts-red-soft); border-color: var(--darts-red); }
      .darts-remove-btn:disabled { opacity: 0.2; cursor: not-allowed; }
      .darts-add-player-btn {
        display: block;
        margin: 0 0 1.5rem;
      }
      .darts-primary-btn, .darts-success-btn, .darts-neutral-btn {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 1.125rem;
        border: none;
        border-radius: 2px;
        padding: 0.875rem 2rem;
        cursor: pointer;
        transition: background-color 0.15s;
      }
      .darts-primary-btn { background: var(--darts-red); color: #fff; }
      .darts-primary-btn:hover { background: var(--darts-red-bright); }
      .darts-primary-btn--lg { width: 100%; }
      .darts-success-btn { background: var(--darts-green); color: #fff; padding: 1rem 2rem; flex: 1; }
      .darts-success-btn:hover { background: var(--darts-green-bright); }
      .darts-neutral-btn { background: var(--darts-stone-800); color: var(--darts-stone-200); padding: 1rem 2rem; flex: 1; }
      .darts-neutral-btn:hover { background: var(--darts-stone-700); }
      .darts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr));
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .darts-player {
        position: relative;
        background: rgba(12, 10, 9, 0.8);
        border: 1px solid var(--darts-stone-800);
        border-radius: 2px;
        padding: 0.625rem 0.75rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        min-width: 0;
      }
      .darts-player--active {
        border-color: var(--darts-red);
        box-shadow:
          0 0 0 1px rgba(220, 38, 38, 0.6),
          0 0 40px -8px rgba(220, 38, 38, 0.5),
          inset 0 0 60px -20px rgba(220, 38, 38, 0.25);
      }
      .darts-player--winner { border-color: var(--darts-amber); }
      .darts-pulse-dot {
        position: absolute;
        top: 0.375rem;
        right: 0.375rem;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: var(--darts-red-bright);
        animation: darts-pulse 2.5s ease-in-out infinite;
      }
      @keyframes darts-pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      .darts-player-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.25rem;
        gap: 0.25rem;
        min-width: 0;
      }
      .darts-player-name {
        font-family: 'Oswald', sans-serif;
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--darts-stone-400);
        margin: 0;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        flex: 1;
      }
      .darts-player-name--winner { color: var(--darts-amber); }
      .darts-win-badge {
        font-family: 'Oswald', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--darts-amber);
        font-size: 0.875rem;
        animation: darts-win-burst 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes darts-win-burst {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .darts-player-score {
        font-family: 'Oswald', sans-serif;
        font-weight: 500;
        font-size: clamp(2.25rem, 9vw, 3rem);
        line-height: 1;
        color: var(--darts-stone-200);
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .darts-player-score--active { color: var(--darts-red-bright); }
      .darts-player-score--winner { color: var(--darts-amber-light); }
      .darts-player-foot {
        margin-top: 0.375rem;
        padding-top: 0.375rem;
        border-top: 1px solid var(--darts-stone-800);
        display: flex;
        justify-content: space-between;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.625rem;
        color: var(--darts-stone-500);
        gap: 0.25rem;
      }
      .darts-bust { color: var(--darts-red-bright); }
      .darts-ok { color: var(--darts-stone-300); }
      .darts-input-card { background: rgba(12, 10, 9, 0.8); }
      .darts-input-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        gap: 0.5rem;
      }
      .darts-input-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--darts-stone-500);
      }
      .darts-input-player {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 1.125rem;
        color: var(--darts-red-bright);
        letter-spacing: 0.05em;
      }
      .darts-checkout {
        margin-bottom: 0.5rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6875rem;
        color: rgba(251, 191, 36, 0.85);
        background: rgba(120, 53, 15, 0.3);
        border: 1px solid rgba(146, 64, 14, 0.4);
        border-radius: 2px;
        padding: 0.375rem 0.625rem;
      }
      .darts-checkout-value { color: var(--darts-amber-light); }
      .darts-display-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 0.375rem;
        margin-bottom: 0.5rem;
      }
      .darts-display {
        background: var(--darts-stone-900);
        border: 1px solid var(--darts-stone-700);
        border-radius: 2px;
        padding: 0.5rem 0.875rem;
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        font-size: 1.875rem;
        line-height: 1;
        color: var(--darts-stone-100);
        font-variant-numeric: tabular-nums;
        display: flex;
        align-items: center;
        min-height: 2.75rem;
        letter-spacing: 0.02em;
      }
      .darts-display--empty { color: var(--darts-stone-600); }
      .darts-keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.375rem;
      }
      .darts-key {
        font-family: 'Oswald', sans-serif;
        font-weight: 500;
        font-size: 1.375rem;
        background: var(--darts-stone-900);
        color: var(--darts-stone-100);
        border: 1px solid var(--darts-stone-700);
        border-radius: 2px;
        padding: 0.5rem 0;
        cursor: pointer;
        transition: background-color 0.1s, border-color 0.1s, transform 0.05s;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        min-height: 2.25rem;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .darts-key:hover { background: var(--darts-stone-800); border-color: var(--darts-stone-600); }
      .darts-key:active { transform: scale(0.97); }
      .darts-key--util {
        font-size: 1.125rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--darts-stone-300);
      }
      .darts-key--submit {
        background: var(--darts-red);
        border-color: var(--darts-red);
        color: #fff;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 1rem;
        grid-column: span 2;
      }
      .darts-key--submit:hover { background: var(--darts-red-bright); border-color: var(--darts-red-bright); }
      .darts-error { color: var(--darts-red-soft); font-size: 0.8125rem; margin: 0.375rem 0 0; }
      .darts-quick {
        display: flex;
        gap: 0.375rem;
        margin-top: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.125rem;
        scrollbar-width: none;
      }
      .darts-quick::-webkit-scrollbar { display: none; }
      .darts-chip {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6875rem;
        color: var(--darts-stone-400);
        background: transparent;
        border: 1px solid var(--darts-stone-700);
        border-radius: 2px;
        padding: 0.25rem 0.625rem;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
        flex-shrink: 0;
      }
      .darts-chip:hover { color: var(--darts-red-soft); border-color: var(--darts-red); }
      .darts-finish-title {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 1.5rem;
        color: var(--darts-amber-light);
        margin: 0 0 0.25rem;
        letter-spacing: 0.04em;
      }
      .darts-finish-sub { color: var(--darts-stone-400); font-size: 0.875rem; margin: 0 0 1.25rem; }
      .darts-finish-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .darts-history-card {
        background: rgba(12, 10, 9, 0.4);
        border: 1px solid var(--darts-stone-900);
        border-radius: 2px;
        padding: 0.5rem 0.625rem;
      }
      .darts-history-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.375rem;
        gap: 0.5rem;
      }
      .darts-history-title {
        font-family: 'Oswald', sans-serif;
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--darts-stone-500);
        margin: 0;
        font-weight: 500;
      }
      .darts-history-title-name { color: var(--darts-red-soft); }
      .darts-history-empty {
        color: var(--darts-stone-600);
        text-align: center;
        padding: 0.5rem 0;
        font-size: 0.75rem;
        margin: 0;
      }
      .darts-history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.125rem; }
      .darts-history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.25rem 0.25rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        gap: 0.5rem;
        font-variant-numeric: tabular-nums;
      }
      .darts-history-left { color: var(--darts-stone-400); }
      .darts-history-meta { color: var(--darts-stone-600); }
      .darts-history-points { color: var(--darts-stone-300); }
      .darts-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        font-family: 'Oswald', sans-serif;
        font-weight: 500;
        text-transform: uppercase;
        font-size: 1.5rem;
        color: var(--darts-stone-500);
        letter-spacing: 0.1em;
      }

      /* Mode picker (setup) */
      .darts-section-title {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.8125rem;
        color: var(--darts-stone-500);
        margin: 0 0 0.625rem;
      }
      .darts-mode-picker { margin-bottom: 1.5rem; }
      .darts-mode-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      @media (min-width: 480px) {
        .darts-mode-grid { grid-template-columns: repeat(4, 1fr); }
      }
      .darts-mode-chip {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.875rem;
        background: var(--darts-stone-900);
        color: var(--darts-stone-300);
        border: 1px solid var(--darts-stone-700);
        border-radius: 2px;
        padding: 0.625rem 0.5rem;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      }
      .darts-mode-chip:hover {
        background: var(--darts-stone-800);
        border-color: var(--darts-stone-600);
      }
      .darts-mode-chip--active {
        background: var(--darts-red);
        border-color: var(--darts-red);
        color: #fff;
      }
      .darts-mode-chip--active:hover {
        background: var(--darts-red-bright);
        border-color: var(--darts-red-bright);
      }
      .darts-mode-config { display: flex; flex-direction: column; gap: 0.75rem; }
      .darts-mode-config:empty { display: none; }
      .darts-config-row {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }
      .darts-config-label {
        font-family: 'Oswald', sans-serif;
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--darts-stone-500);
        font-weight: 500;
      }
      .darts-segmented {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 0;
        border: 1px solid var(--darts-stone-700);
        border-radius: 2px;
        overflow: hidden;
      }
      .darts-segmented-btn {
        font-family: 'Oswald', sans-serif;
        font-weight: 500;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: transparent;
        color: var(--darts-stone-300);
        border: none;
        border-right: 1px solid var(--darts-stone-700);
        padding: 0.5rem 0.5rem;
        cursor: pointer;
        transition: background-color 0.15s, color 0.15s;
      }
      .darts-segmented-btn:last-child { border-right: none; }
      .darts-segmented-btn:hover { background: var(--darts-stone-800); }
      .darts-segmented-btn--active {
        background: var(--darts-red);
        color: #fff;
      }
      .darts-segmented-btn--active:hover { background: var(--darts-red-bright); }

      /* Mode badge in header */
      .darts-mode-badge {
        font-family: 'Oswald', sans-serif;
        font-weight: 500;
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--darts-stone-500);
        margin-top: 0.125rem;
      }

      /* 3-dart-slot input layout (Cricket / Clock / Shanghai) */
      .darts-dart-slots {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .darts-dart-slot {
        background: var(--darts-stone-900);
        border: 1px solid var(--darts-stone-700);
        border-radius: 2px;
        padding: 0.5rem 0.375rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.375rem;
        min-height: 4rem;
        font-family: inherit;
        color: inherit;
        cursor: pointer;
        transition: background-color 0.1s, border-color 0.1s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .darts-dart-slot-label {
        font-family: 'Oswald', sans-serif;
        font-size: 0.625rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--darts-stone-500);
      }
      .darts-dart-slot-value {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        font-size: 1.25rem;
        color: var(--darts-stone-100);
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .darts-dart-slot-value--miss { color: var(--darts-stone-600); }

      /* Mult toggle (S/D/T) */
      .darts-mult-toggle {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.25rem;
        margin-bottom: 0.5rem;
      }
      .darts-mult-btn {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        font-size: 0.875rem;
        background: var(--darts-stone-900);
        color: var(--darts-stone-300);
        border: 1px solid var(--darts-stone-700);
        border-radius: 2px;
        padding: 0.5rem 0;
        cursor: pointer;
        transition: background-color 0.1s, border-color 0.1s, color 0.1s;
      }
      .darts-mult-btn:hover { background: var(--darts-stone-800); }
      .darts-mult-btn--active {
        background: var(--darts-red);

    </style>
  </head>
  <body>
    <div id="root"><div class="darts-loading">LADE …</div></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-presets="react">
      const { useState, useMemo } = React;

      const MIN_PLAYERS = 2;
      const MAX_PLAYERS = 8;
      const defaultName = (i) => `Spieler ${i + 1}`;
      const INITIAL_NAMES = [defaultName(0), defaultName(1), defaultName(2)];

      const CHECKOUT_HINTS = {
        170: "T20 T20 Bull", 167: "T20 T19 Bull", 164: "T20 T18 Bull", 161: "T20 T17 Bull",
        160: "T20 T20 D20", 158: "T20 T20 D19", 157: "T20 T19 D20", 156: "T20 T20 D18",
        155: "T20 T19 D19", 154: "T20 T18 D20", 153: "T20 T19 D18", 152: "T20 T20 D16",
        151: "T20 T17 D20", 150: "T20 T18 D18", 149: "T20 T19 D16", 148: "T20 T20 D14",
        147: "T20 T17 D18", 146: "T20 T18 D16", 145: "T20 T15 D20", 144: "T20 T20 D12",
        143: "T20 T17 D16", 142: "T20 T14 D20", 141: "T20 T19 D12", 140: "T20 T20 D10",
        139: "T19 T14 D20", 138: "T20 T18 D12", 137: "T20 T15 D16", 136: "T20 T20 D8",
        135: "Bull T17 D17", 134: "T20 T14 D16", 133: "T20 T19 D8", 132: "Bull Bull D16",
        131: "T20 T13 D16", 130: "T20 T18 D8", 129: "T19 T16 D12", 128: "T18 T14 D16",
        127: "T20 T17 D8", 126: "T19 T19 D6", 125: "T20 T15 D10", 124: "T20 T16 D8",
        123: "T19 T16 D9", 122: "T18 T18 D7", 121: "T20 T11 D14", 120: "T20 S20 D20",
        119: "T19 T12 D13", 118: "T20 S18 D20", 117: "T20 S17 D20", 116: "T20 S16 D20",
        115: "T20 S15 D20", 114: "T20 S14 D20", 113: "T20 S13 D20", 112: "T20 S12 D20",
        111: "T20 S11 D20", 110: "T20 S10 D20", 109: "T20 S9 D20", 108: "T20 S16 D16",
        107: "T19 S10 D20", 106: "T20 S6 D20", 105: "T20 S13 D16", 104: "T18 S18 D16",
        103: "T19 S10 D18", 102: "T20 S10 D16", 101: "T17 S10 D20", 100: "T20 D20",
        99: "T19 S10 D16", 98: "T20 D19", 97: "T19 D20", 96: "T20 D18", 95: "T19 D19",
        94: "T18 D20", 93: "T19 D18", 92: "T20 D16", 91: "T17 D20", 90: "T20 D15",
        89: "T19 D16", 88: "T20 D14", 87: "T17 D18", 86: "T18 D16", 85: "T15 D20",
        84: "T20 D12", 83: "T17 D16", 82: "Bull D16", 81: "T19 D12", 80: "T20 D10",
        79: "T19 D11", 78: "T18 D12", 77: "T19 D10", 76: "T20 D8", 75: "T17 D12",
        74: "T14 D16", 73: "T19 D8", 72: "T16 D12", 71: "T13 D16", 70: "T18 D8",
        69: "T19 D6", 68: "T20 D4", 67: "T17 D8", 66: "T10 D18", 65: "T19 D4",
        64: "T16 D8", 63: "T13 D12", 62: "T10 D16", 61: "T15 D8", 60: "S20 D20",
        59: "S19 D20", 58: "S18 D20", 57: "S17 D20", 56: "S16 D20", 55: "S15 D20",
        54: "S14 D20", 53: "S13 D20", 52: "S12 D20", 51: "S11 D20", 50: "Bull",
        49: "S9 D20", 48: "S16 D16", 47: "S15 D16", 46: "S14 D16", 45: "S13 D16",
        44: "S12 D16", 43: "S11 D16", 42: "S10 D16", 41: "S9 D16", 40: "D20",
        38: "D19", 36: "D18", 34: "D17", 32: "D16", 30: "D15", 28: "D14", 26: "D13",
        24: "D12", 22: "D11", 20: "D10", 18: "D9", 16: "D8", 14: "D7", 12: "D6",
        10: "D5", 8: "D4", 6: "D3", 4: "D2", 2: "D1",
      };

      const QUICK_VALUES = [0, 26, 41, 45, 60, 81, 100, 140, 180];
      const KEYPAD_DIGITS = [7, 8, 9, 4, 5, 6, 1, 2, 3];
      const HISTORY_LIMIT = 4;
      const MULT_LABEL = ['Miss', 'S', 'D', 'T'];

      // ===================================================================
      // X01 mode (301 / 501 / 701 · Single / Double / Master Out)
      // ===================================================================
      const X01_FINISH_LABEL = { single: 'Single Out', double: 'Double Out', master: 'Master Out' };

      function X01ConfigUI({ config, setConfig }) {
        return (
          <>
            <div className="darts-config-row">
              <span className="darts-config-label">Startpunktzahl</span>
              <div className="darts-segmented">
                {[301, 501, 701].map((s) => (
                  <button key={s} type="button"
                    className={"darts-segmented-btn" + (config.startScore === s ? " darts-segmented-btn--active" : "")}
                    onClick={() => setConfig({ ...config, startScore: s })}>{s}</button>
                ))}
              </div>
            </div>
            <div className="darts-config-row">
              <span className="darts-config-label">Finish</span>
              <div className="darts-segmented">
                {[['single','Single'],['double','Double'],['master','Master']].map(([k,l]) => (
                  <button key={k} type="button"
                    className={"darts-segmented-btn" + (config.finish === k ? " darts-segmented-btn--active" : "")}
                    onClick={() => setConfig({ ...config, finish: k })}>{l}</button>
                ))}
              </div>
            </div>
          </>
        );
      }

      function X01InputPanel({ player, modeConfig, error, setError, applyResult }) {
        const [input, setInput] = useState("");
        const [pending, setPending] = useState(null);

        const checkoutHint = (modeConfig.finish === 'double') ? (CHECKOUT_HINTS[player.score] || null) : null;

        const appendDigit = (d) => {
          setError("");
          const next = input === "0" ? String(d) : input + String(d);
          if (parseInt(next, 10) > 180) return;
          if (next.length > 3) return;
          setInput(next);
        };
        const deleteDigit = () => { setError(""); setInput(v => v.slice(0, -1)); };
        const setQuick = (v) => { setError(""); setInput(String(v)); };
        const clearInput = () => { setError(""); setInput(""); };

        const apply = (scored, finishedOnSpecial, bust, reason) => {
          const newScore = bust ? player.score : (player.score - scored);
          const throwScored = bust ? 0 : scored;
          const newPlayer = {
            ...player,
            score: newScore,
            throws: [...player.throws, { scored: throwScored, attempted: scored, bust, reason, finishedOnSpecial: !bust && finishedOnSpecial }],
          };
          applyResult({
            playerUpdate: newPlayer,
            historyData: { mode: 'x01', scored: throwScored, attempted: scored, before: player.score, after: newScore, bust, reason },
            win: !bust && newScore === 0,
          });
          setInput("");
          setPending(null);
        };

        const submit = () => {
          setError("");
          if (input === "") { setError("Keine Zahl eingegeben."); return; }
          const val = parseInt(input, 10);
          if (isNaN(val) || val < 0 || val > 180) { setError("Bitte eine Zahl zwischen 0 und 180 eingeben."); return; }
          const remaining = player.score - val;

          if (modeConfig.finish === 'single') {
            if (remaining < 0) apply(val, false, true, "Überworfen");
            else apply(val, false, false, null);
            return;
          }
          // double / master
          if (remaining === 0) { setPending({ scored: val }); return; }
          if (remaining === 1 && modeConfig.finish === 'double') { apply(val, false, true, "Rest 1 (nicht ausspielbar)"); return; }
          if (remaining < 0) { apply(val, false, true, "Überworfen"); return; }
          apply(val, false, false, null);
        };

        const confirmFinish = (yes) => {
          if (yes) apply(pending.scored, true, false, null);
          else apply(pending.scored, false, true, modeConfig.finish === 'master' ? "Kein Doppel/Triple" : "Kein Doppel");
        };

        if (pending) {
          return (
            <div>
              <p className="darts-finish-title">{player.name} – mögliches Finish!</p>
              <p className="darts-finish-sub">
                {modeConfig.finish === 'master' ? "Mit Doppel oder Triple beendet?" : "Mit Doppel beendet?"}
              </p>
              <div className="darts-finish-buttons">
                <button onClick={() => confirmFinish(true)} className="darts-success-btn">Ja ✓</button>
                <button onClick={() => confirmFinish(false)} className="darts-neutral-btn">Nein – Bust</button>
              </div>
            </div>
          );
        }

        return (
          <>
            <div className="darts-input-head">
              <span className="darts-input-label">Aufnahme von</span>
              <span className="darts-input-player">{player.name}</span>
            </div>
            {checkoutHint && (
              <div className="darts-checkout">
                💡 Checkout: <span className="darts-checkout-value">{checkoutHint}</span>
              </div>
            )}
            <div className="darts-display-row">
              <div className={"darts-display" + (input === "" ? " darts-display--empty" : "")}>
                {input === "" ? "0–180" : input}
              </div>
              <button type="button" onClick={deleteDigit} className="darts-key darts-key--util" aria-label="Letzte Ziffer löschen">⌫</button>
              <button type="button" onClick={clearInput} className="darts-key darts-key--util" aria-label="Eingabe leeren">C</button>
            </div>
            <div className="darts-keypad">
              {KEYPAD_DIGITS.map(d => (<button key={d} type="button" onClick={() => appendDigit(d)} className="darts-key">{d}</button>))}
              <button type="button" onClick={() => appendDigit(0)} className="darts-key">0</button>
              <button type="button" onClick={submit} className="darts-key darts-key--submit">Eintragen</button>
            </div>
            {error && <p className="darts-error">{error}</p>}
            <div className="darts-quick">
              {QUICK_VALUES.map(v => (<button key={v} type="button" onClick={() => setQuick(v)} className="darts-chip">{v}</button>))}
            </div>
          </>
        );
      }

      function X01PlayerCard({ player, isActive, isWinner }) {
        const lastThrow = player.throws[player.throws.length - 1];
        const totalThrown = player.throws.reduce((s, t) => s + t.scored, 0);
        const avg = player.throws.length ? (totalThrown / player.throws.length).toFixed(0) : "—";
        return (
          <>
            <div className={"darts-player-score" +
              (isActive ? " darts-player-score--active" : "") +
              (isWinner ? " darts-player-score--winner" : "")}>{player.score}</div>
            <div className="darts-player-foot">
              <span>Ø {avg}</span>
              <span>{lastThrow ? (
                <span className={lastThrow.bust ? "darts-bust" : "darts-ok"}>
                  {lastThrow.bust ? "BUST" : `+${lastThrow.scored}`}
                </span>
              ) : "—"}</span>
            </div>
          </>
        );
      }

      function X01HistoryItem({ entry }) {
        return (
          <>
            <span className="darts-history-left">
              <span className="darts-history-meta">{entry.before} → {entry.after}</span>
            </span>
            <span className={entry.bust ? "darts-bust" : "darts-history-points"}>
              {entry.bust ? `BUST (${entry.attempted}) – ${entry.reason}` : `+${entry.scored}`}
            </span>
          </>
        );
      }

      const X01_MODE = {
        id: 'x01', label: 'X01',
        fullLabel: (cfg) => `${cfg.startScore} · ${X01_FINISH_LABEL[cfg.finish]}`,
        defaultConfig: { startScore: 501, finish: 'double' },
        initPlayer: (name, cfg) => ({ name, score: cfg.startScore, throws: [] }),
        initState: () => ({}),
        ConfigUI: X01ConfigUI,
        InputPanel: X01InputPanel,
        PlayerCard: X01PlayerCard,
        HistoryItem: X01HistoryItem,
      };

      // ===================================================================
      // Cricket (15-20 + Bull, 3 Treffer öffnen, Punkte solange Gegner offen)
      // ===================================================================
      const CRICKET_TARGETS = ['20','19','18','17','16','15','B'];
      const CRICKET_VALUES = { '15': 15, '16': 16, '17': 17, '18': 18, '19': 19, '20': 20, 'B': 25 };

      function CricketConfigUI({ config, setConfig }) {
        return (
          <div className="darts-config-row">
            <span className="darts-config-label">Variante</span>
            <div className="darts-segmented">
              <button type="button"
                className={"darts-segmented-btn" + (!config.noScore ? " darts-segmented-btn--active" : "")}
                onClick={() => setConfig({ ...config, noScore: false })}>Mit Punkten</button>
              <button type="button"
                className={"darts-segmented-btn" + (config.noScore ? " darts-segmented-btn--active" : "")}
                onClick={() => setConfig({ ...config, noScore: true })}>No-Score</button>
            </div>
          </div>
        );
      }

      function CricketInputPanel({ player, modeConfig, error, setError, applyResult, allPlayers, currentIdx }) {
        const empty = () => [{target:null,mult:0},{target:null,mult:0},{target:null,mult:0}];
        const [darts, setDarts] = useState(empty);
        const [activeSlot, setActiveSlot] = useState(0);
        const reset = () => { setDarts(empty()); setActiveSlot(0); setError(""); };

        const onTarget = (t) => {
          setError("");
          setDarts(d => d.map((dd,i) => i === activeSlot ? { target: t, mult: dd.mult || 1 } : dd));
        };
        const onMult = (m) => {
          setError("");
          if (darts[activeSlot].target === 'B' && m === 3) return;
          setDarts(d => d.map((dd,i) => i === activeSlot ? { ...dd, mult: m } : dd));
          if (activeSlot < 2) setActiveSlot(activeSlot + 1);
        };

        const submit = () => {
          setError("");
          const newPlayer = { ...player, hits: { ...player.hits } };
          let pointsGained = 0;
          for (const dart of darts) {
            if (!dart.target || dart.mult === 0) continue;
            const t = dart.target;
            const max = (t === 'B') ? 2 : 3;
            const mult = Math.min(dart.mult, max);
            const wasHits = newPlayer.hits[t];
            const newHits = wasHits + mult;
            if (newHits <= 3) {
              newPlayer.hits[t] = newHits;
            } else {
              const opening = 3 - wasHits;
              const overflow = mult - opening;
              newPlayer.hits[t] = 3;
              if (!modeConfig.noScore) {
                const allOppClosed = allPlayers.every((p, i) => i === currentIdx ? true : ((p.hits && p.hits[t]) >= 3));
                if (!allOppClosed) pointsGained += overflow * CRICKET_VALUES[t];
              }
            }
          }
          newPlayer.points = (player.points || 0) + pointsGained;
          const allClosed = CRICKET_TARGETS.every(t => newPlayer.hits[t] >= 3);
          const maxOpp = Math.max(0, ...allPlayers.filter((_, i) => i !== currentIdx).map(p => p.points || 0));
          const win = allClosed && (modeConfig.noScore || newPlayer.points >= maxOpp);
          applyResult({
            playerUpdate: newPlayer,
            historyData: { mode: 'cricket', darts: darts.map(d => ({...d})), pointsGained },
            win,
          });
          reset();
        };

        const bullDisabled = darts[activeSlot].target === 'B';

        return (
          <>
            <div className="darts-input-head">
              <span className="darts-input-label">Aufnahme von</span>
              <span className="darts-input-player">{player.name}</span>
            </div>
            <div className="darts-dart-slots">
              {darts.map((d, i) => (
                <button key={i} type="button" onClick={() => setActiveSlot(i)}
                  className="darts-dart-slot"
                  style={activeSlot === i ? { borderColor: 'var(--darts-red)', background: 'rgba(220,38,38,0.08)' } : {}}>
                  <span className="darts-dart-slot-label">Dart {i + 1}</span>
                  <span className={"darts-dart-slot-value" + (!d.target || d.mult === 0 ? " darts-dart-slot-value--miss" : "")}>
                    {!d.target || d.mult === 0 ? "—" : (MULT_LABEL[d.mult] + d.target)}
                  </span>
                </button>
              ))}
            </div>
            <div className="darts-target-grid">
              {CRICKET_TARGETS.map(t => (
                <button key={t} type="button" onClick={() => onTarget(t)}
                  className={"darts-target-btn" + (darts[activeSlot].target === t ? " darts-target-btn--active" : "")}>
                  {t}
                </button>
              ))}
            </div>
            <div className="darts-mult-toggle">
              <button type="button" onClick={() => onMult(0)} className={"darts-mult-btn" + (darts[activeSlot].mult === 0 ? " darts-mult-btn--active" : "")}>Miss</button>
              <button type="button" onClick={() => onMult(1)} className={"darts-mult-btn" + (darts[activeSlot].mult === 1 ? " darts-mult-btn--active" : "")}>S</button>
              <button type="button" onClick={() => onMult(2)} className={"darts-mult-btn" + (darts[activeSlot].mult === 2 ? " darts-mult-btn--active" : "")}>D</button>
              <button type="button" onClick={() => onMult(3)} disabled={bullDisabled} className={"darts-mult-btn" + (darts[activeSlot].mult === 3 ? " darts-mult-btn--active" : "")}>T</button>
            </div>
            <div className="darts-display-row" style={{gridTemplateColumns: '1fr auto'}}>
              <button type="button" onClick={submit} className="darts-key darts-key--submit" style={{gridColumn: 'span 1'}}>Eintragen</button>
              <button type="button" onClick={reset} className="darts-key darts-key--util">C</button>
            </div>
            {error && <p className="darts-error">{error}</p>}
          </>
        );
      }

      function CricketPlayerCard({ player }) {
        return (
          <>
            <div className="darts-cricket-row">
              {CRICKET_TARGETS.map(t => {
                const hits = (player.hits && player.hits[t]) || 0;
                const closed = hits >= 3;
                const mark = hits === 0 ? '·' : hits === 1 ? '/' : hits === 2 ? 'X' : '⊘';
                return (
                  <div key={t} className={"darts-cricket-cell" + (closed ? " darts-cricket-cell--closed" : "")}>
                    <span className="darts-cricket-cell-num">{t}</span>
                    <span className="darts-cricket-cell-mark">{mark}</span>
                  </div>
                );
              })}
            </div>
            <div className="darts-cricket-points">{player.points || 0} Pkt</div>
          </>
        );
      }

      function CricketHistoryItem({ entry }) {
        const dartsStr = entry.darts.filter(d => d.target && d.mult > 0).map(d => MULT_LABEL[d.mult] + d.target).join(' ');
        return (
          <>
            <span className="darts-history-left">
              <span className="darts-history-meta">{dartsStr || 'Miss'}</span>
            </span>
            <span className="darts-history-points">+{entry.pointsGained || 0}</span>
          </>
        );
      }

      const CRICKET_MODE = {
        id: 'cricket', label: 'Cricket',
        fullLabel: (cfg) => cfg.noScore ? 'Cricket · No-Score' : 'Cricket',
        defaultConfig: { noScore: false },
        initPlayer: (name) => ({
          name,
          hits: { '15':0,'16':0,'17':0,'18':0,'19':0,'20':0,'B':0 },
          points: 0,
        }),
        initState: () => ({}),
        ConfigUI: CricketConfigUI,
        InputPanel: CricketInputPanel,
        PlayerCard: CricketPlayerCard,
        HistoryItem: CricketHistoryItem,
      };

      // ===================================================================
      // Around the Clock (1..20 → Bull)
      // ===================================================================
      function ClockConfigUI() { return null; }

      function ClockInputPanel({ player, applyResult, error, setError }) {
        const empty = () => [{hit:false},{hit:false},{hit:false}];
        const [darts, setDarts] = useState(empty);
        const reset = () => { setDarts(empty()); setError(""); };

        const toggleDart = (i) => setDarts(d => d.map((dd, idx) => idx === i ? { hit: !dd.hit } : dd));

        const targetLabel = (n) => n > 20 ? 'Bull' : String(n);

        const submit = () => {
          setError("");
          let cur = player.current;
          let hitsAdded = 0;
          let totalDarts = (player.darts || 0);
          const dartLog = [];
          for (const dart of darts) {
            totalDarts += 1;
            const target = cur > 20 ? 'B' : cur;
            if (dart.hit) {
              dartLog.push({ target, hit: true });
              if (cur > 20) {
                applyResult({
                  playerUpdate: { ...player, current: cur, hits: (player.hits || 0) + hitsAdded + 1, darts: totalDarts },
                  historyData: { mode: 'clock', darts: dartLog, before: player.current, after: 'WIN' },
                  win: true,
                });
                reset();
                return;
              }
              cur += 1;
              hitsAdded += 1;
            } else {
              dartLog.push({ target, hit: false });
            }
          }
          applyResult({
            playerUpdate: { ...player, current: cur, hits: (player.hits || 0) + hitsAdded, darts: totalDarts },
            historyData: { mode: 'clock', darts: dartLog, before: player.current, after: cur },
            win: false,
          });
          reset();
        };

        return (
          <>
            <div className="darts-input-head">
              <span className="darts-input-label">Aufnahme von</span>
              <span className="darts-input-player">{player.name}</span>
            </div>
            <div className="darts-checkout" style={{textAlign:'center'}}>
              Aktuelles Ziel: <span className="darts-checkout-value">{targetLabel(player.current)}</span>
            </div>
            <div className="darts-dart-slots">
              {darts.map((d, i) => {
                let simTarget = player.current;
                for (let j = 0; j < i; j++) if (darts[j].hit && simTarget <= 20) simTarget += 1;
                return (
                  <button key={i} type="button" onClick={() => toggleDart(i)}
                    className="darts-dart-slot"
                    style={d.hit ? { borderColor: 'var(--darts-red)', background: 'rgba(220,38,38,0.08)' } : {}}>
                    <span className="darts-dart-slot-label">Dart {i + 1}</span>
                    <span className={"darts-dart-slot-value" + (!d.hit ? " darts-dart-slot-value--miss" : "")}>
                      {(d.hit ? '✓ ' : '✗ ') + targetLabel(simTarget)}
                    </span>
                  </button>
                );
              })}
            </div>
            <div className="darts-display-row" style={{gridTemplateColumns: '1fr auto'}}>
              <button type="button" onClick={submit} className="darts-key darts-key--submit" style={{gridColumn: 'span 1'}}>Eintragen</button>
              <button type="button" onClick={reset} className="darts-key darts-key--util">C</button>
            </div>
            {error && <p className="darts-error">{error}</p>}
          </>
        );
      }

      function ClockPlayerCard({ player, isActive, isWinner }) {
        const target = player.current > 20 ? 'Bull' : player.current;
        return (
          <>
            <div className="darts-clock-target" style={isActive ? {color: 'var(--darts-red-bright)'} : isWinner ? {color: 'var(--darts-amber-light)'} : {}}>
              <span className="darts-clock-arrow">→</span>{target}
            </div>
            <div className="darts-clock-meta">
              {(player.hits || 0)}/21 · {(player.darts || 0)} Darts
            </div>
          </>
        );
      }

      function ClockHistoryItem({ entry }) {
        const log = entry.darts.map(d => (d.hit ? '✓' : '✗') + (d.target === 'B' ? 'B' : d.target)).join(' ');
        return (
          <>
            <span className="darts-history-left">
              <span className="darts-history-meta">{log}</span>
            </span>
            <span className="darts-history-points">→ {entry.after === 'WIN' ? 'WIN' : (entry.after > 20 ? 'Bull' : entry.after)}</span>
          </>
        );
      }

      const CLOCK_MODE = {
        id: 'clock', label: 'Around Clock',
        fullLabel: () => 'Around the Clock',
        defaultConfig: {},
        initPlayer: (name) => ({ name, current: 1, hits: 0, darts: 0 }),
        initState: () => ({}),
        ConfigUI: ClockConfigUI,
        InputPanel: ClockInputPanel,
        PlayerCard: ClockPlayerCard,
        HistoryItem: ClockHistoryItem,
      };

      // ===================================================================
      // Shanghai (Runden Start..20 · S+D+T einer Runde = sofort Sieg)
      // ===================================================================
      function ShanghaiConfigUI({ config, setConfig }) {
        return (
          <div className="darts-config-row">
            <span className="darts-config-label">Startrunde</span>
            <div className="darts-segmented">
              {[1,7,10].map(s => (
                <button key={s} type="button"
                  className={"darts-segmented-btn" + (config.startRound === s ? " darts-segmented-btn--active" : "")}
                  onClick={() => setConfig({ ...config, startRound: s })}>R {s}</button>
              ))}
            </div>
          </div>
        );
      }

      function ShanghaiInputPanel({ player, applyResult, error, setError, modeState }) {
        const round = modeState.round;
        const empty = () => [{mult:0},{mult:0},{mult:0}];
        const [darts, setDarts] = useState(empty);
        const reset = () => { setDarts(empty()); setError(""); };
        const setDart = (i, m) => setDarts(d => d.map((dd, idx) => idx === i ? { mult: m } : dd));

        const submit = () => {
          setError("");
          const mults = darts.map(d => d.mult);
          let pointsGained = 0;
          for (const m of mults) if (m > 0) pointsGained += round * m;
          const isShanghai = mults.includes(1) && mults.includes(2) && mults.includes(3);
          const newPlayer = {
            ...player,
            points: (player.points || 0) + pointsGained,
            shanghai: !!(player.shanghai || isShanghai),
          };
          applyResult({
            playerUpdate: newPlayer,
            historyData: { mode: 'shanghai', round, mults, pointsGained, shanghai: isShanghai },
            win: isShanghai,
          });
          reset();
        };

        return (
          <>
            <div className="darts-input-head">
              <span className="darts-input-label">Aufnahme von</span>
              <span className="darts-input-player">{player.name}</span>
            </div>
            <div className="darts-shanghai-round">
              Runde {round} · Ziel <strong>{round}</strong>
            </div>
            <div className="darts-dart-slots">
              {darts.map((d, i) => (
                <div key={i} className="darts-dart-slot" style={{padding: '0.375rem 0.25rem', minHeight: '5.5rem', justifyContent: 'space-between'}}>
                  <span className="darts-dart-slot-label">Dart {i + 1}</span>
                  <span className={"darts-dart-slot-value" + (d.mult === 0 ? " darts-dart-slot-value--miss" : "")}
                        style={{fontSize: '0.9375rem'}}>
                    {d.mult === 0 ? '—' : MULT_LABEL[d.mult] + round}
                  </span>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'0.125rem',width:'100%'}}>
                    {[0,1,2,3].map(m => (
                      <button key={m} type="button" onClick={() => setDart(i, m)}
                        className={"darts-mult-btn" + (d.mult === m ? " darts-mult-btn--active" : "")}
                        style={{fontSize:'0.625rem',padding:'0.25rem 0'}}>
                        {m === 0 ? '—' : MULT_LABEL[m]}
                      </button>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            <div className="darts-display-row" style={{gridTemplateColumns: '1fr auto'}}>
              <button type="button" onClick={submit} className="darts-key darts-key--submit" style={{gridColumn: 'span 1'}}>Eintragen</button>
              <button type="button" onClick={reset} className="darts-key darts-key--util">C</button>
            </div>
            {error && <p className="darts-error">{error}</p>}
          </>
        );
      }

      function ShanghaiPlayerCard({ player, isActive, isWinner, modeState }) {
        return (
          <>
            <div className={"darts-player-score" +
              (isActive ? " darts-player-score--active" : "") +
              (isWinner ? " darts-player-score--winner" : "")}>
              {player.points || 0}
            </div>
            <div className="darts-player-foot">
              <span>R {modeState.round}</span>
              <span>{player.shanghai ? <span className="darts-bust">SHANGHAI</span> : "—"}</span>
            </div>
          </>
        );
      }

      function ShanghaiHistoryItem({ entry }) {
        const mults = entry.mults.map(m => m === 0 ? '—' : MULT_LABEL[m]).join(' ');
        return (
          <>
            <span className="darts-history-left">
              <span className="darts-history-meta">R{entry.round}: {mults}</span>
            </span>
            <span className={entry.shanghai ? "darts-bust" : "darts-history-points"}>
              +{entry.pointsGained}{entry.shanghai ? ' SHANGHAI!' : ''}
            </span>
          </>
        );
      }

      const SHANGHAI_MODE = {
        id: 'shanghai', label: 'Shanghai',
        fullLabel: (cfg) => `Shanghai R${cfg.startRound}-20`,
        defaultConfig: { startRound: 7 },
        initPlayer: (name) => ({ name, points: 0, shanghai: false }),
        initState: (cfg) => ({ round: cfg.startRound }),
        onTurnAdvance: (players, modeState, nextIdx) => {
          if (nextIdx === 0) {
            const nextRound = modeState.round + 1;
            if (nextRound > 20) {
              let bestIdx = 0;
              for (let i = 1; i < players.length; i++) {
                if ((players[i].points || 0) > (players[bestIdx].points || 0)) bestIdx = i;
              }
              return { win: true, winnerIdx: bestIdx };
            }
            return { modeStateUpdate: { round: nextRound } };
          }
          return null;
        },
        ConfigUI: ShanghaiConfigUI,
        InputPanel: ShanghaiInputPanel,
        PlayerCard: ShanghaiPlayerCard,
        HistoryItem: ShanghaiHistoryItem,
      };

      const MODES = {
        x01: X01_MODE,
        cricket: CRICKET_MODE,
        clock: CLOCK_MODE,
        shanghai: SHANGHAI_MODE,
      };

      // ===================================================================
      // Main component
      // ===================================================================
      function DartsGame() {
        const [phase, setPhase] = useState("setup");
        const [names, setNames] = useState(INITIAL_NAMES);
        const [modeId, setModeId] = useState('x01');
        const [modeConfig, setModeConfig] = useState(MODES.x01.defaultConfig);
        const [players, setPlayers] = useState([]);
        const [modeState, setModeState] = useState({});
        const [currentIdx, setCurrentIdx] = useState(0);
        const [history, setHistory] = useState([]);
        const [error, setError] = useState("");
        const [winnerIdx, setWinnerIdx] = useState(null);

        const driver = MODES[modeId];

        const switchMode = (id) => {
          setModeId(id);
          setModeConfig(MODES[id].defaultConfig);
        };

        const startGame = () => {
          const initial = names.map((n, i) => driver.initPlayer(n.trim() || defaultName(i), modeConfig));
          setPlayers(initial);
          setModeState(driver.initState(modeConfig));
          setCurrentIdx(0);
          setHistory([]);
          setWinnerIdx(null);
          setError("");
          setPhase("playing");
        };

        const addPlayer = () => {
          if (names.length >= MAX_PLAYERS) return;
          setNames([...names, defaultName(names.length)]);
        };

        const removePlayer = (i) => {
          if (names.length <= MIN_PLAYERS) return;
          setNames(names.filter((_, idx) => idx !== i));
        };

        const applyResult = (result) => {
          const snapshot = {
            players: players.map(p => structuredClone(p)),
            modeState: structuredClone(modeState),
            currentIdx, phase, winnerIdx,
          };
          let newPlayers = players.map((p, i) => i === currentIdx ? result.playerUpdate : p);
          let newModeState = modeState;
          let newPhase = phase;
          let newWinnerIdx = winnerIdx;
          let newCurrentIdx = currentIdx;

          if (result.win) {
            newPhase = 'finished';
            newWinnerIdx = currentIdx;
          } else {
            newCurrentIdx = (currentIdx + 1) % players.length;
            if (driver.onTurnAdvance) {
              const adv = driver.onTurnAdvance(newPlayers, newModeState, newCurrentIdx, modeConfig);
              if (adv) {
                if (adv.modeStateUpdate) newModeState = { ...newModeState, ...adv.modeStateUpdate };
                if (adv.win) { newPhase = 'finished'; newWinnerIdx = adv.winnerIdx; }
              }
            }
          }

          setPlayers(newPlayers);
          setModeState(newModeState);
          setCurrentIdx(newCurrentIdx);
          setPhase(newPhase);
          setWinnerIdx(newWinnerIdx);
          setHistory(h => [...h, { playerIdx: currentIdx, snapshot, data: result.historyData }]);
          setError("");
        };

        const undo = () => {
          if (history.length === 0) return;
          const last = history[history.length - 1];
          setPlayers(last.snapshot.players);
          setModeState(last.snapshot.modeState);
          setCurrentIdx(last.snapshot.currentIdx);
          setPhase(last.snapshot.phase);
          setWinnerIdx(last.snapshot.winnerIdx);
          setHistory(h => h.slice(0, -1));
          setError("");
        };

        const reset = () => {
          if (!window.confirm("Spiel wirklich zurücksetzen?")) return;
          setPhase("setup");
          setPlayers([]);
          setModeState({});
          setHistory([]);
          setWinnerIdx(null);
          setError("");
        };

        const activeHistory = useMemo(
          () => history.filter(h => h.playerIdx === currentIdx),
          [history, currentIdx]
        );

        const isGame = phase === "playing" || phase === "finished";
        const titleText = isGame ? driver.fullLabel(modeConfig) : "Dart";

        return (
          <div className="darts-root">
            <div className={"darts-container darts-grain" + (isGame ? " darts-game-view" : "")}>
              <header className="darts-header">
                <div>
                  <h1 className="darts-title">{titleText}</h1>
                  <p className="darts-subtitle">Ein Brett · ein Sieger</p>
                </div>
                {phase !== "setup" && (
                  <button onClick={reset} className="darts-link-btn">↺ Neues Spiel</button>
                )}
              </header>

              {phase === "setup" && (
                <div className="darts-card darts-setup">
                  <div className="darts-mode-picker">
                    <h3 className="darts-section-title">Spielmodus</h3>
                    <div className="darts-mode-grid">
                      {Object.values(MODES).map(m => (
                        <button key={m.id} type="button" onClick={() => switchMode(m.id)}
                          className={"darts-mode-chip" + (modeId === m.id ? " darts-mode-chip--active" : "")}>
                          {m.label}
                        </button>
                      ))}
                    </div>
                    <div className="darts-mode-config">
                      {driver.ConfigUI && <driver.ConfigUI config={modeConfig} setConfig={setModeConfig} />}
                    </div>
                  </div>

                  <h3 className="darts-section-title" style={{marginTop: '0.5rem'}}>Spieler</h3>
                  <div className="darts-name-list">
                    {names.map((n, i) => (
                      <div key={i} className="darts-name-row">
                        <div className="darts-name-num">{i + 1}</div>
                        <input
                          type="text"
                          value={n}
                          onChange={(e) => setNames(names.map((v, idx) => (idx === i ? e.target.value : v)))}
                          placeholder={defaultName(i)}
                          className="darts-name-input"
                        />
                        <button
                          type="button"
                          onClick={() => removePlayer(i)}
                          disabled={names.length <= MIN_PLAYERS}
                          className="darts-remove-btn"
                          aria-label="Spieler entfernen"
                          title={names.length <= MIN_PLAYERS ? `Mindestens ${MIN_PLAYERS} Spieler` : "Spieler entfernen"}
                        >×</button>
                      </div>
                    ))}
                  </div>
                  <button
                    type="button"
                    onClick={addPlayer}
                    disabled={names.length >= MAX_PLAYERS}
                    className="darts-link-btn darts-add-player-btn"
                  >
                    + Spieler hinzufügen
                  </button>
                  <button onClick={startGame} className="darts-primary-btn darts-primary-btn--lg">
                    Spiel starten
                  </button>
                </div>
              )}

              {isGame && (
                <>
                  <div className="darts-grid">
                    {players.map((p, i) => {
                      const isActive = phase === "playing" && i === currentIdx;
                      const isWinner = phase === "finished" && i === winnerIdx;
                      const cardClass = ["darts-player",
                        isActive && "darts-player--active",
                        isWinner && "darts-player--winner"]
                        .filter(Boolean).join(" ");
                      return (
                        <div key={i} className={cardClass}>
                          {isActive && <div className="darts-pulse-dot" />}
                          <div className="darts-player-head">
                            <h3 className={"darts-player-name" + (isWinner ? " darts-player-name--winner" : "")}>{p.name}</h3>
                            {isWinner && <span className="darts-win-badge">★</span>}
                          </div>
                          <driver.PlayerCard
                            player={p} isActive={isActive} isWinner={isWinner}
                            modeConfig={modeConfig} modeState={modeState}
                          />
                        </div>
                      );
                    })}
                  </div>

                  {phase === "playing" && (
                    <div className="darts-card darts-input-card">
                      <driver.InputPanel
                        key={modeId + ':' + currentIdx + ':' + (modeState.round || 0)}
                        player={players[currentIdx]}
                        modeConfig={modeConfig}
                        modeState={modeState}
                        applyResult={applyResult}
                        allPlayers={players}
                        currentIdx={currentIdx}
                        error={error}
                        setError={setError}
                      />
                    </div>
                  )}

                  <div className="darts-history-card">
                    <div className="darts-history-head">
                      <h3 className="darts-history-title">
                        Verlauf · <span className="darts-history-title-name">{players[currentIdx].name}</span>
                      </h3>
                      <button onClick={undo} disabled={history.length === 0} className="darts-link-btn">
                        ← Rückgängig
                      </button>
                    </div>
                    {activeHistory.length === 0 ? (
                      <p className="darts-history-empty">Noch keine Würfe</p>
                    ) : (
                      <ul className="darts-history-list">
                        {activeHistory.slice().reverse().slice(0, HISTORY_LIMIT).map((h, idx) => (
                          <li key={idx} className="darts-history-item">
                            <driver.HistoryItem entry={h.data} />
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                </>
              )}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<DartsGame />);
    </script>
  </body>
</html>
